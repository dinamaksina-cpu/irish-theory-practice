:root{--bg:#f5f7fb;--card:#fff;--text:#152033;--muted:#687386;--accent:#15a36d;--line:#e5e9f0}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}header{position:sticky;top:0;z-index:5;background:rgba(245,247,251,.96);backdrop-filter:blur(12px);padding:14px 14px 10px;border-bottom:1px solid var(--line)}h1{font-size:22px;margin:0 0 10px}.search{width:100%;padding:13px 15px;border:1px solid var(--line);border-radius:14px;font-size:16px;background:white}.chips{display:flex;gap:8px;overflow:auto;padding:10px 0 2px;scrollbar-width:none}.chip{white-space:nowrap;border:1px solid var(--line);background:white;border-radius:999px;padding:9px 13px;font-weight:700}.chip.active{background:#153b34;color:white;border-color:#153b34}main{padding:14px;max-width:1050px;margin:auto}.count{font-size:13px;color:var(--muted);margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{border:0;background:var(--card);border-radius:18px;padding:10px;box-shadow:0 5px 18px rgba(24,39,75,.07);min-height:175px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}.pic{height:110px;width:100%;display:flex;align-items:center;justify-content:center}.pic img{max-width:100%;max-height:105px;object-fit:contain}.title{font-size:14px;font-weight:800;text-align:center;line-height:1.25;margin-top:8px}.cat{font-size:11px;color:var(--muted);text-align:center;margin-top:5px}.broken{font-size:12px;color:#a33;text-align:center;line-height:1.35}.retry{margin-top:7px;border:0;border-radius:10px;padding:7px 10px;background:#eef1f5;font-weight:700;color:#334}.overlay{position:fixed;inset:0;background:rgba(9,18,30,.45);z-index:20;display:none;align-items:flex-end}.overlay.open{display:flex}.sheet{background:white;width:100%;max-height:92vh;border-radius:24px 24px 0 0;padding:18px;overflow:auto}.handle{width:44px;height:5px;background:#d7dce5;border-radius:4px;margin:0 auto 16px}.close{float:right;border:0;background:#eef1f5;width:38px;height:38px;border-radius:50%;font-size:22px}.heroimg{height:210px;display:flex;align-items:center;justify-content:center;clear:both}.heroimg img{max-height:195px;max-width:90%;object-fit:contain}h2{font-size:22px}.badge{display:inline-block;background:#e8f7f1;color:#08734d;padding:7px 10px;border-radius:999px;font-size:12px;font-weight:800}.info{background:#f7f9fc;padding:14px;border-radius:16px;margin:12px 0;line-height:1.5}.nav{display:flex;gap:10px}.nav button{flex:1;padding:13px;border:0;border-radius:14px;font-weight:800}@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}.overlay{align-items:center;justify-content:center}.sheet{max-width:560px;border-radius:24px}}
</style></head><body><header><h1>Irish Road Signs</h1><input id="q" class="search" placeholder="Пошук знака…"><div id="chips" class="chips"></div></header><main><div id="count" class="count"></div><div id="grid" class="grid"></div></main><div id="overlay" class="overlay"><div class="sheet"><div class="handle"></div><button id="close" class="close">×</button><div id="detail"></div></div></div><script>
function proxyUrl(url){
  try{const u=new URL(url);return `https://images.weserv.nl/?url=${encodeURIComponent(u.host+u.pathname+u.search)}&w=500&output=webp`;}catch(e){return url}
}
function imageFail(img){
  if(!img.dataset.proxyTried){
    img.dataset.proxyTried='1';
    img.src=proxyUrl(img.dataset.original||img.src);
    return;
  }
  const wrap=img.parentElement;
  wrap.innerHTML='<div class="broken">Зображення тимчасово не завантажилось<br><button class="retry" type="button">Спробувати ще раз</button></div>';
  const btn=wrap.querySelector('.retry');
  if(btn) btn.onclick=(e)=>{e.stopPropagation(); const original=wrap.dataset.original; wrap.innerHTML=`<img loading="eager" data-original="${original}" src="${original}" alt="Road sign" onerror="imageFail(this)">`;};
}

t/uploads/2021/06/100m-to-next-exit-1.png"},{"id":244,"category":"Motorway signs","title":"Motorway ends 1km ahead","image":"https://nationaldrivingschool.ie/wp-content/uploads/2021/06/The-motorway-ends-1km-ahead-1.png"},{"id":245,"category":"Motorway signs","title":"Motorway ends 500m ahead","image":"https://nationaldrivingschool.ie/wp-content/uploads/2021/06/Motorway-ends-500m-ahead.png"},{"id":246,"category":"Motorway signs","title":"End of motorway","image":"https://nationaldrivingschool.ie/wp-content/uploads/2021/06/End-of-motorway-1.png"},{"id":247,"category":"Motorway signs","title":"Route confirmatory sign for M7","image":"https://nationaldrivingschool.ie/wp-content/uploads/2021/07/Route-confirmatory-sign-for-M7.png"},{"id":248,"category":"Motorway signs","title":"Advance direction for destination","image":"https://nationaldrivingschool.ie/wp-content/uploads/2021/06/Advance-direction-for-destination.png"},{"id":249,"category":"Motorway signs","title":"Entry to motorway","image":"https://nationaldrivingschool.ie/wp-content/uploads/2021/06/Entry-to-motorway.png"},{"id":250,"category":"Motorway signs","title":"Toll plaza ahead","image":"https://nationaldrivingschool.ie/wp-content/uploads/2021/07/Toll-plaza-ahead-1.png"},{"id":251,"category":"Motorway signs","title":"Toll charges","image":"https://nationaldrivingschool.ie/wp-content/uploads/2021/06/Toll-charges.png"},{"id":252,"category":"Motorway signs","title":"Toll plaza information sign","image":"https://nationaldrivingschool.ie/wp-content/uploads/2021/06/Toll-plaza-information-sign.png"},{"id":253,"category":"Motorway signs","title":"Garda only","image":"https://nationaldrivingschool.ie/wp-content/uploads/2021/07/Garda-only-1.png"},{"id":254,"category":"Motorway signs","title":"Authorised vehicles only","image":"https://nationaldrivingschool.ie/wp-content/uploads/2021/07/Authorized-vehicles-only.png"},{"id":255,"category":"Motorway signs","title":"Typical 2km next exit sign","image":"https://nationaldrivingschool.ie/wp-content/uploads/2021/06/Typical-2km-next-exit-sign.png"},{"id":256,"category":"Motorway signs","title":"Motorway service plaza","image":"https://nationaldrivingschool.ie/wp-content/uploads/2021/06/Motorway-service-plaza.png"},{"id":257,"category":"Motorway signs","title":"Route confirmatory sign with Euro Route marker","image":"https://nationaldrivingschool.ie/wp-content/uploads/2021/07/Route-confirmatory-sign-with-Euro-Route-marker-plate.png"},{"id":258,"category":"Motorway signs","title":"Typical lane gain sign","image":"https://nationaldrivingschool.ie/wp-content/uploads/2021/07/Typical-lane-gain-sign.png"}];let cat='Усі',filtered=[],current=0;const cats=['Усі',...new Set(DATA.map(x=>x.category))];
function renderChips(){chips.innerHTML=cats.map(c=>`<button class="chip ${c===cat?'active':''}" data-c="${c}">${c}</button>`).join('');chips.querySelectorAll('button').forEach(b=>b.onclick=()=>{cat=b.dataset.c;renderChips();render()})}
function render(){const s=q.value.trim().toLowerCase();filtered=DATA.filter(x=>(cat==='Усі'||x.category===cat)&&(!s||x.title.toLowerCase().includes(s)||x.category.toLowerCase().includes(s)));count.textContent=`${filtered.length} знаків`;grid.innerHTML=filtered.map((x,i)=>`<button class="card" data-i="${i}"><div class="pic" data-original="${x.image}"><img loading="lazy" data-original="${x.image}" src="${x.image}" alt="${x.title}" onerror="imageFail(this)"></div><div class="title">${x.title}</div><div class="cat">${x.category}</div></button>`).join('');grid.querySelectorAll('.card').forEach(b=>b.onclick=()=>openCard(+b.dataset.i))}
function openCard(i){current=i;const x=filtered[i];detail.innerHTML=`<span class="badge">${x.category}</span><div class="heroimg" data-original="${x.image}"><img data-original="${x.image}" src="${x.image}" alt="${x.title}" onerror="imageFail(this)"></div><h2>${x.title}</h2><div class="info"><b>Що означає</b><br>Цей знак повідомляє водієві про правило, обмеження або небезпеку: <b>${x.title}</b>.</div><div class="info"><b>Що повинен зробити водій</b><br>Заздалегідь оцініть дорожню ситуацію, зменште швидкість за потреби та виконайте вимогу знака.</div><div class="info"><b>Порада для тесту</b><br>Звертайте увагу на форму, колір і символ — вони допомагають визначити групу та значення знака.</div><div class="nav"><button onclick="move(-1)">← Попередній</button><button onclick="move(1)">Наступний →</button></div>`;overlay.classList.add('open')}
function move(d){if(!filtered.length)return;openCard((current+d+filtered.length)%filtered.length)}q.oninput=render;close.onclick=()=>overlay.classList.remove('open');overlay.onclick=e=>{if(e.target===overlay)overlay.classList.remove('open')};renderChips();render();
</script></body></html>
