<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Irish Road Markings</title><style>
:root{--bg:#f5f7fb;--card:#fff;--text:#152033;--muted:#687386;--accent:#153b34;--blue:#0788f5;--line:#e5e9f0}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}body.no-scroll{overflow:hidden}header{position:sticky;top:0;z-index:5;background:rgba(245,247,251,.97);backdrop-filter:blur(12px);padding:14px;border-bottom:1px solid var(--line)}.toprow{display:flex;align-items:center;justify-content:space-between;gap:10px}.backmenu{display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:var(--accent);background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 14px;font-weight:800}.langbar{display:flex;gap:7px}.langbtn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 13px;font-weight:800;color:var(--blue)}.langbtn.active{background:var(--accent);color:#fff;border-color:var(--accent)}h1{font-size:27px;margin:12px 0}.search{width:100%;padding:15px;border:1px solid var(--line);border-radius:16px;font-size:16px;background:#fff}.chips{display:flex;gap:8px;overflow:auto;padding:12px 0 2px;scrollbar-width:none}.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;color:var(--blue);border-radius:999px;padding:10px 14px;font-weight:800}.chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}main{padding:14px;max-width:1050px;margin:auto}.count{font-size:14px;color:var(--muted);margin:8px 0 14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{border:0;background:var(--card);border-radius:20px;padding:11px;box-shadow:0 5px 18px rgba(24,39,75,.07);min-height:210px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}.pic{height:125px;width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:14px}.pic img{width:100%;height:100%;object-fit:cover}.title{font-size:14px;font-weight:900;text-align:center;line-height:1.25;margin-top:10px;color:var(--blue)}.translation{font-size:12px;color:var(--muted);text-align:center;line-height:1.25;margin-top:5px}.overlay{position:fixed;inset:0;background:rgba(9,18,30,.48);z-index:20;display:none;align-items:flex-end}.overlay.open{display:flex}.sheet{position:relative;background:#fff;width:100%;max-height:92vh;border-radius:24px 24px 0 0;padding:18px;overflow:auto}.handle{width:44px;height:5px;background:#d7dce5;border-radius:4px;margin:0 auto 16px}.close{position:absolute;right:16px;top:14px;border:0;background:#eef1f5;width:40px;height:40px;border-radius:50%;font-size:24px;cursor:pointer}.heroimg{height:230px;display:flex;align-items:center;justify-content:center;margin-top:20px}.heroimg img{max-width:100%;max-height:220px;border-radius:16px;object-fit:contain}.badge{display:inline-block;background:#e8f7f1;color:#08734d;padding:7px 10px;border-radius:999px;font-size:12px;font-weight:800}.detail-title{font-size:23px;margin:14px 0 5px}.detail-translation{font-size:17px;color:var(--muted);font-weight:700}.info{background:#f7f9fc;padding:14px;border-radius:16px;margin:12px 0;line-height:1.5}.source-note{font-size:11px;color:var(--muted);text-align:right;margin:-4px 4px 12px}.nav{display:flex;gap:10px}.nav button{flex:1;padding:13px;border:0;border-radius:14px;font-weight:800}.broken{font-size:12px;color:#a33;text-align:center}@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}.overlay{align-items:center;justify-content:center}.sheet{max-width:580px;border-radius:24px}}

.card{position:relative;transition:transform .15s ease,box-shadow .15s ease}.card:active{transform:scale(.98)}.card-info{position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.96);border:1px solid var(--line);box-shadow:0 3px 10px rgba(24,39,75,.10);font-size:18px;font-weight:800;color:#0b84ff;line-height:1;pointer-events:none}.intro-overlay{position:fixed;inset:0;background:rgba(9,18,30,.48);z-index:50;display:none;align-items:center;justify-content:center;padding:22px}.intro-overlay.open{display:flex}.intro-box{width:min(100%,420px);background:#fff;border-radius:24px;padding:24px;box-shadow:0 20px 60px rgba(9,18,30,.22);text-align:center}.intro-icon{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;background:#e8f7f1;color:#153b34;font-size:30px;font-weight:800}.intro-box h3{margin:0 0 10px;font-size:22px}.intro-box p{margin:0 0 20px;color:var(--muted);line-height:1.5;font-size:16px}.intro-ok{width:100%;border:0;border-radius:14px;padding:14px;background:#153b34;color:#fff;font-size:16px;font-weight:800;cursor:pointer}
</style></head><body><header><div class="toprow"><a class="backmenu" href="index.html">← <span id="menuText">Меню</span></a><div class="langbar"><button class="langbtn" data-lang="uk">UA</button><button class="langbtn" data-lang="en">EN</button><button class="langbtn" data-lang="ru">RU</button></div></div><h1 id="pageTitle"></h1><input id="q" class="search"><div id="chips" class="chips"></div></header><main><div id="count" class="count"></div><div id="grid" class="grid"></div></main><div id="introOverlay" class="intro-overlay" role="dialog" aria-modal="true" aria-labelledby="introTitle"><div class="intro-box"><div class="intro-icon">ⓘ</div><h3 id="introTitle"></h3><p id="introText"></p><button id="introOk" class="intro-ok" type="button"></button></div></div><div id="overlay" class="overlay"><div class="sheet"><div class="handle"></div><button id="close" class="close" aria-label="Close">×</button><div id="detail"></div></div></div><script>
const DATA=[{"id":1,"category":"Parking restrictions","title":"Single yellow line","image":"https://static.aviva.io/content/dam/aviva-public/ie/articles/car/1%20-%20irish-road-markings-single-yellow-lines.jpg","uk":"Одна жовта лінія","ru":"Одна жёлтая линия","en_desc":"Parking is prohibited during the times shown on a nearby information sign. Check the sign because the restriction times can vary.","uk_desc":"Паркування заборонене у години, зазначені на найближчому інформаційному знаку. Перевіряйте знак, оскільки години дії обмеження можуть відрізнятися.","ru_desc":"Парковка запрещена в часы, указанные на ближайшем информационном знаке. Проверяйте знак, поскольку время действия ограничения может отличаться."},{"id":2,"category":"Parking restrictions","title":"Double yellow lines","image":"https://static.aviva.io/content/dam/aviva-public/ie/articles/car/2%20-%20irish-road-markings-double-yellow-lines.jpg","uk":"Подвійні жовті лінії","ru":"Двойные жёлтые линии","en_desc":"Parking is prohibited at all times. The restriction normally applies every day, including Sundays and public holidays.","uk_desc":"Паркування заборонене в будь-який час. Обмеження зазвичай діє щодня, включно з неділями та державними святами.","ru_desc":"Парковка запрещена в любое время. Ограничение обычно действует ежедневно, включая воскресенья и государственные праздники."},{"id":3,"category":"Road edge markings","title":"Broken yellow hard-shoulder line","image":"https://static.aviva.io/content/dam/aviva-public/ie/articles/car/3%20-%20irish-road-markings-single-broken-yellow-line-along-the-left-hand-side-of-the-road.jpg","uk":"Переривчаста жовта лінія узбіччя","ru":"Прерывистая жёлтая линия обочины","en_desc":"Marks the edge of the carriageway and the hard shoulder. On ordinary roads, a driver may use the hard shoulder briefly only when it is safe, for example to allow faster traffic to pass, while giving priority to pedestrians and cyclists. On a motorway, use the hard shoulder only in an emergency.","uk_desc":"Позначає край проїзної частини та узбіччя. На звичайній дорозі водій може короткочасно використати узбіччя лише тоді, коли це безпечно, наприклад щоб пропустити швидший транспорт, надаючи перевагу пішоходам і велосипедистам. На автомагістралі узбіччя використовують лише в аварійній ситуації.","ru_desc":"Обозначает край проезжей части и обочину. На обычной дороге водитель может кратковременно использовать обочину только когда это безопасно, например чтобы пропустить более быстрый транспорт, уступая пешеходам и велосипедистам. На автомагистрали обочину используют только в аварийной ситуации."},{"id":4,"category":"Junction markings","title":"Yield line","image":"data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20800%20500%22%3E%3Crect%20width%3D%22800%22%20height%3D%22500%22%20fill%3D%22%23b8c6ce%22%2F%3E%3Cpath%20d%3D%22M0%200H800V70L0%20170Z%22%20fill%3D%22%234ea06f%22%2F%3E%3Cpath%20d%3D%22M0%20430L800%20330V500H0Z%22%20fill%3D%22%234ea06f%22%2F%3E%3Crect%20x%3D%2280%22%20y%3D%22250%22%20width%3D%22640%22%20height%3D%2222%22%20rx%3D%226%22%20fill%3D%22%23fff%22%20stroke%3D%22%23dbe2e8%22%20stroke-width%3D%223%22%20stroke-dasharray%3D%2255%2026%22%2F%3E%3Cpath%20d%3D%22M400%20330%20L345%20420%20L455%20420%20Z%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%2218%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fsvg%3E","uk":"Лінія «Дати дорогу»","ru":"Линия «Уступить дорогу»","en_desc":"A broken white line across the lane marks where you must yield. Slow down, give way to traffic on the major road and stop if necessary. A white triangular yield symbol may also be painted on the road.","uk_desc":"Переривчаста біла лінія поперек смуги показує місце, де потрібно дати дорогу. Зменште швидкість, пропустіть транспорт на головній дорозі та за потреби зупиніться. На дорозі також може бути намальований білий трикутник.","ru_desc":"Прерывистая белая линия поперёк полосы показывает место, где нужно уступить дорогу. Снизьте скорость, пропустите транспорт на главной дороге и при необходимости остановитесь. На дороге также может быть нанесён белый треугольник."},{"id":5,"category":"Junction markings","title":"Stop line","image":"data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20800%20500%22%3E%3Crect%20width%3D%22800%22%20height%3D%22500%22%20fill%3D%22%23b8c6ce%22%2F%3E%3Cpath%20d%3D%22M0%200H800V70L0%20170Z%22%20fill%3D%22%234ea06f%22%2F%3E%3Cpath%20d%3D%22M0%20430L800%20330V500H0Z%22%20fill%3D%22%234ea06f%22%2F%3E%3Crect%20x%3D%2280%22%20y%3D%22245%22%20width%3D%22640%22%20height%3D%2226%22%20rx%3D%224%22%20fill%3D%22%23fff%22%2F%3E%3Ctext%20x%3D%22400%22%20y%3D%22390%22%20text-anchor%3D%22middle%22%20font-family%3D%22Arial%22%20font-size%3D%22100%22%20font-weight%3D%22700%22%20fill%3D%22%23fff%22%3ESTOP%3C%2Ftext%3E%3C%2Fsvg%3E","uk":"Стоп-лінія","ru":"Стоп-линия","en_desc":"A continuous white line across the lane marks where you must come to a complete stop. The word STOP may also be painted on the road and an upright Stop sign may be present.","uk_desc":"Суцільна біла лінія поперек смуги показує місце, перед яким потрібно повністю зупинитися. На дорозі також може бути напис STOP та встановлений знак Stop.","ru_desc":"Сплошная белая линия поперёк полосы показывает место, перед которым нужно полностью остановиться. На дороге также может быть надпись STOP и установлен знак Stop."},{"id":6,"category":"Junction markings","title":"Advanced stop line for cyclists","image":"data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20800%20500%22%3E%3Crect%20width%3D%22800%22%20height%3D%22500%22%20fill%3D%22%23b8c6ce%22%2F%3E%3Cpath%20d%3D%22M0%200H800V70L0%20170Z%22%20fill%3D%22%234ea06f%22%2F%3E%3Cpath%20d%3D%22M0%20430L800%20330V500H0Z%22%20fill%3D%22%234ea06f%22%2F%3E%3Crect%20x%3D%22110%22%20y%3D%22210%22%20width%3D%22580%22%20height%3D%2240%22%20fill%3D%22%23fff%22%2F%3E%3Crect%20x%3D%22110%22%20y%3D%22125%22%20width%3D%22580%22%20height%3D%2270%22%20fill%3D%22%23e9939f%22%20opacity%3D%22.85%22%20stroke%3D%22%23fff%22%20stroke-width%3D%228%22%2F%3E%3Ccircle%20cx%3D%22400%22%20cy%3D%22160%22%20r%3D%2222%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%228%22%2F%3E%3Cpath%20d%3D%22M400%20182v45m0-27l-42%2028m42-28l42%2028m-42-18l-32%2050m32-50l32%2050%22%20stroke%3D%22%23fff%22%20stroke-width%3D%228%22%20stroke-linecap%3D%22round%22%20fill%3D%22none%22%2F%3E%3C%2Fsvg%3E","uk":"Випереджальна стоп-лінія для велосипедистів","ru":"Продвинутая стоп-линия для велосипедистов","en_desc":"At traffic lights, cyclists may wait in the marked box in front of motor traffic. Drivers must stop at the first white line they reach, must not enter the cycle box on red, and must give cyclists time and space to move off.","uk_desc":"На світлофорі велосипедисти можуть чекати у позначеній зоні перед автомобілями. Водій повинен зупинитися перед першою білою лінією, не в’їжджати у велосипедний бокс на червоне світло та дати велосипедистам час і простір для початку руху.","ru_desc":"На светофоре велосипедисты могут ожидать в обозначенной зоне перед автомобилями. Водитель должен остановиться перед первой белой линией, не въезжать в велосипедный бокс на красный свет и дать велосипедистам время и пространство для начала движения."},{"id":7,"category":"Junction markings","title":"Right-turn box","image":"data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20800%20500%22%3E%3Crect%20width%3D%22800%22%20height%3D%22500%22%20fill%3D%22%23b8c6ce%22%2F%3E%3Cpath%20d%3D%22M0%200H800V70L0%20170Z%22%20fill%3D%22%234ea06f%22%2F%3E%3Cpath%20d%3D%22M0%20430L800%20330V500H0Z%22%20fill%3D%22%234ea06f%22%2F%3E%3Crect%20x%3D%22250%22%20y%3D%22115%22%20width%3D%22300%22%20height%3D%22240%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%2216%22%2F%3E%3Cpath%20d%3D%22M400%20315V185m0%200l-55%2055m55-55l55%2055%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%2220%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%20transform%3D%22rotate(90%20400%20250)%22%2F%3E%3C%2Fsvg%3E","uk":"Зона очікування повороту праворуч","ru":"Зона ожидания поворота направо","en_desc":"A white-edged box with an arrow shows where a vehicle may wait to turn right at a signal-controlled junction. Do not enter through a red light. If oncoming traffic prevents the turn, wait in the box until it is safe to complete the turn.","uk_desc":"Біла прямокутна зона зі стрілкою показує місце, де автомобіль може очікувати повороту праворуч на регульованому перехресті. Не в’їжджайте туди на червоне світло. Якщо зустрічний рух заважає повернути, зачекайте в зоні, доки поворот не стане безпечним.","ru_desc":"Белая прямоугольная зона со стрелкой показывает место, где автомобиль может ожидать поворота направо на регулируемом перекрёстке. Не въезжайте туда на красный свет. Если встречное движение мешает повернуть, подождите в зоне, пока поворот не станет безопасным."},{"id":8,"category":"Centre lines","title":"Single broken white centre line","image":"https://static.aviva.io/content/dam/aviva-public/ie/articles/car/5%20-%20irish-road-markeings-single-broken-white-lines-along-the-centre-of-the-road.jpg","uk":"Одна переривчаста біла центральна лінія","ru":"Одна прерывистая белая центральная линия","en_desc":"Separates traffic travelling in opposite directions. You may cross it to overtake or turn only when the road ahead is clear and it is safe and legal to do so.","uk_desc":"Розділяє транспортні потоки протилежних напрямків. Перетинати її для обгону або повороту можна лише тоді, коли дорога попереду вільна і маневр є безпечним та дозволеним.","ru_desc":"Разделяет транспортные потоки встречных направлений. Пересекать её для обгона или поворота можно только когда дорога впереди свободна и манёвр безопасен и разрешён."},{"id":9,"category":"Centre lines","title":"Longer broken white warning line","image":"https://static.aviva.io/content/dam/aviva-public/ie/articles/car/6%20-%20irish-road-markings-single-longer-broken-white-lines-with-shorter-gaps-between-the-lines.jpg","uk":"Довга переривчаста біла попереджувальна лінія","ru":"Длинная прерывистая белая предупреждающая линия","en_desc":"Longer white marks with shorter gaps warn of a hazard or a continuous white line ahead. Take extra care and complete any overtaking manoeuvre in good time.","uk_desc":"Довші білі штрихи з коротшими проміжками попереджають про небезпеку або суцільну білу лінію попереду. Будьте особливо уважні та завчасно завершіть обгін.","ru_desc":"Более длинные белые штрихи с короткими промежутками предупреждают об опасности или сплошной белой линии впереди. Будьте особенно внимательны и заранее завершите обгон."},{"id":10,"category":"Centre lines","title":"Single solid white centre line","image":"https://static.aviva.io/content/dam/aviva-public/ie/articles/car/7%20-%20irish-road-markings-single-solid-white-line.jpg","uk":"Одна суцільна біла центральна лінія","ru":"Одна сплошная белая центральная линия","en_desc":"Keep to the left of the line. Do not cross it to overtake or make a U-turn, except where the rules specifically allow crossing, such as access to premises or an emergency.","uk_desc":"Тримайтеся ліворуч від лінії. Не перетинайте її для обгону чи розвороту, крім випадків, прямо дозволених правилами, наприклад для заїзду на прилеглу територію або в надзвичайній ситуації.","ru_desc":"Держитесь слева от линии. Не пересекайте её для обгона или разворота, кроме случаев, прямо разрешённых правилами, например для въезда на прилегающую территорию или в экстренной ситуации."},{"id":11,"category":"Centre lines","title":"Continuous and broken white lines","image":"data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20800%20500%22%3E%3Crect%20width%3D%22800%22%20height%3D%22500%22%20fill%3D%22%23b8c6ce%22%2F%3E%3Cpath%20d%3D%22M0%200H800V70L0%20170Z%22%20fill%3D%22%234ea06f%22%2F%3E%3Cpath%20d%3D%22M0%20430L800%20330V500H0Z%22%20fill%3D%22%234ea06f%22%2F%3E%3Cpath%20d%3D%22M0%20215L800%20110%22%20stroke%3D%22%23fff%22%20stroke-width%3D%2220%22%2F%3E%3Cpath%20d%3D%22M0%20260L800%20155%22%20stroke%3D%22%23fff%22%20stroke-width%3D%2220%22%20stroke-dasharray%3D%2282%2050%22%2F%3E%3C%2Fsvg%3E","uk":"Суцільна та переривчаста білі лінії","ru":"Сплошная и прерывистая белые линии","en_desc":"Obey the line nearest to your vehicle. If the nearest line is broken, you may cross when it is safe. If the nearest line is continuous, you must not cross it except where the rules specifically permit.","uk_desc":"Дотримуйтеся лінії, найближчої до вашого автомобіля. Якщо найближча лінія переривчаста, її можна перетнути, коли це безпечно. Якщо найближча лінія суцільна, перетинати її не можна, крім спеціально дозволених правилами випадків.","ru_desc":"Соблюдайте линию, ближайшую к вашему автомобилю. Если ближайшая линия прерывистая, её можно пересечь, когда это безопасно. Если ближайшая линия сплошная, пересекать её нельзя, кроме специально разрешённых правилами случаев."},{"id":12,"category":"Centre lines","title":"Double broken white lines","image":"https://static.aviva.io/content/dam/aviva-public/ie/articles/car/8%20-%20irish-road-markings-double-broken-white-lines.jpg","uk":"Подвійні переривчасті білі лінії","ru":"Двойные прерывистые белые линии","en_desc":"Warn that a continuous white line is ahead. Do not begin an overtaking manoeuvre unless you can complete it safely before the solid line starts.","uk_desc":"Попереджають, що попереду починається суцільна біла лінія. Не починайте обгін, якщо не зможете безпечно завершити його до початку суцільної лінії.","ru_desc":"Предупреждают, что впереди начинается сплошная белая линия. Не начинайте обгон, если не сможете безопасно завершить его до начала сплошной линии."},{"id":13,"category":"Crossing markings","title":"Zebra crossing","image":"data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20800%20500%22%3E%3Crect%20width%3D%22800%22%20height%3D%22500%22%20fill%3D%22%23b8c6ce%22%2F%3E%3Cpath%20d%3D%22M0%200H800V70L0%20170Z%22%20fill%3D%22%234ea06f%22%2F%3E%3Cpath%20d%3D%22M0%20430L800%20330V500H0Z%22%20fill%3D%22%234ea06f%22%2F%3E%3Cg%20transform%3D%22rotate(-8%20400%20250)%22%3E%3Crect%20x%3D%22170%22%20y%3D%22120%22%20width%3D%2250%22%20height%3D%22260%22%20fill%3D%22%23fff%22%2F%3E%3Crect%20x%3D%22260%22%20y%3D%22120%22%20width%3D%2250%22%20height%3D%22260%22%20fill%3D%22%23fff%22%2F%3E%3Crect%20x%3D%22350%22%20y%3D%22120%22%20width%3D%2250%22%20height%3D%22260%22%20fill%3D%22%23fff%22%2F%3E%3Crect%20x%3D%22440%22%20y%3D%22120%22%20width%3D%2250%22%20height%3D%22260%22%20fill%3D%22%23fff%22%2F%3E%3Crect%20x%3D%22530%22%20y%3D%22120%22%20width%3D%2250%22%20height%3D%22260%22%20fill%3D%22%23fff%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E","uk":"Пішохідний перехід «зебра»","ru":"Пешеходный переход «зебра»","en_desc":"A zebra crossing is a designated pedestrian crossing. Approach at a safe speed, be ready to stop and yield to pedestrians who are on or have begun to cross.","uk_desc":"«Зебра» — це позначений пішохідний перехід. Наближайтеся з безпечною швидкістю, будьте готові зупинитися та пропустіть пішоходів, які вже переходять або почали переходити дорогу.","ru_desc":"«Зебра» — это обозначенный пешеходный переход. Приближайтесь с безопасной скоростью, будьте готовы остановиться и уступите пешеходам, которые уже переходят или начали переходить дорогу."},{"id":14,"category":"Crossing markings","title":"Zig-zag lines at a pedestrian crossing","image":"https://static.aviva.io/content/dam/aviva-public/ie/articles/car/9%20-%20irish-road-markings-white-lines-that-run-in-zig-zags.jpg","uk":"Зигзагоподібні лінії біля пішохідного переходу","ru":"Зигзагообразные линии у пешеходного перехода","en_desc":"These lines mark the controlled area of a pedestrian crossing. Do not park in this area and do not overtake the vehicle nearest the crossing if it has stopped or is slowing for pedestrians.","uk_desc":"Ці лінії позначають контрольовану зону пішохідного переходу. Не паркуйтеся в цій зоні та не обганяйте транспортний засіб біля переходу, якщо він зупинився або сповільнюється для пішоходів.","ru_desc":"Эти линии обозначают контролируемую зону пешеходного перехода. Не паркуйтесь в этой зоне и не обгоняйте транспортное средство у перехода, если оно остановилось или замедляется для пешеходов."},{"id":15,"category":"Junction markings","title":"Yellow box junction","image":"https://static.aviva.io/content/dam/aviva-public/ie/articles/car/10%20-%20irish-road-markings-yellow-diagonal-box-in-the-centre-of-the-road.jpg","uk":"Жовта коробчаста розмітка перехрестя","ru":"Жёлтая коробчатая разметка перекрёстка","en_desc":"Do not enter the yellow box unless your exit is clear. When turning right, you may wait in the box if you are prevented from completing the turn only by oncoming traffic or other right-turning vehicles.","uk_desc":"Не в’їжджайте в жовту розмітку, якщо виїзд із неї не вільний. Повертаючи праворуч, можна чекати в зоні, якщо завершити поворот заважає лише зустрічний транспорт або інші автомобілі, що повертають праворуч.","ru_desc":"Не въезжайте в жёлтую разметку, если выезд из неё не свободен. Поворачивая направо, можно ждать в зоне, если завершить поворот мешает только встречный транспорт или другие автомобили, поворачивающие направо."},{"id":16,"category":"Special road markings","title":"No Entry road marking","image":"data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20800%20500%22%3E%3Crect%20width%3D%22800%22%20height%3D%22500%22%20fill%3D%22%23b8c6ce%22%2F%3E%3Cpath%20d%3D%22M0%200H800V70L0%20170Z%22%20fill%3D%22%234ea06f%22%2F%3E%3Cpath%20d%3D%22M0%20430L800%20330V500H0Z%22%20fill%3D%22%234ea06f%22%2F%3E%3Ctext%20x%3D%22400%22%20y%3D%22250%22%20text-anchor%3D%22middle%22%20font-family%3D%22Arial%22%20font-size%3D%22115%22%20font-weight%3D%22700%22%20fill%3D%22%23fff%22%3ENO%20ENTRY%3C%2Ftext%3E%3Cpath%20d%3D%22M110%20320H690%22%20stroke%3D%22%23fff%22%20stroke-width%3D%2218%22%20stroke-dasharray%3D%2270%2042%22%2F%3E%3C%2Fsvg%3E","uk":"Напис NO ENTRY","ru":"Надпись NO ENTRY","en_desc":"Shows the wrong end of a one-way street or another road that vehicles must not enter. Do not proceed beyond the marking.","uk_desc":"Позначає заборонений в’їзд, наприклад неправильний кінець вулиці з одностороннім рухом. Не продовжуйте рух за цю розмітку.","ru_desc":"Обозначает запрещённый въезд, например неправильный конец улицы с односторонним движением. Не продолжайте движение за эту разметку."},{"id":17,"category":"Hatched markings","title":"Hatched markings for merging or diverging traffic","image":"data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20800%20500%22%3E%3Crect%20width%3D%22800%22%20height%3D%22500%22%20fill%3D%22%23b8c6ce%22%2F%3E%3Cpath%20d%3D%22M0%200H800V70L0%20170Z%22%20fill%3D%22%234ea06f%22%2F%3E%3Cpath%20d%3D%22M0%20430L800%20330V500H0Z%22%20fill%3D%22%234ea06f%22%2F%3E%3Cpath%20d%3D%22M80%20370L340%20260L720%20155%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%2218%22%2F%3E%3Cpath%20d%3D%22M80%20410L360%20295L720%20195%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%2218%22%2F%3E%3Cg%20stroke%3D%22%23fff%22%20stroke-width%3D%2213%22%3E%3Cpath%20d%3D%22M135%20370.55l65%20-70%22%2F%3E%3Cpath%20d%3D%22M205%20351.65l65%20-70%22%2F%3E%3Cpath%20d%3D%22M275%20332.75l65%20-70%22%2F%3E%3Cpath%20d%3D%22M345%20313.85l65%20-70%22%2F%3E%3Cpath%20d%3D%22M415%20294.95l65%20-70%22%2F%3E%3Cpath%20d%3D%22M485%20276.05l65%20-70%22%2F%3E%3Cpath%20d%3D%22M555%20257.15l65%20-70%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E","uk":"Штрихована зона для злиття або розділення потоків","ru":"Штрихованная зона для слияния или разделения потоков","en_desc":"Hatched areas channel traffic where lanes merge or separate. Keep out of the marked area unless broken boundary lines and the road layout clearly allow entry and it is safe; never enter an area bounded by a continuous line.","uk_desc":"Штриховані зони спрямовують рух там, де смуги зливаються або розходяться. Не в’їжджайте в позначену зону, якщо межа суцільна. Якщо межа переривчаста, в’їзд можливий лише коли це дозволяє дорожня ситуація і це безпечно.","ru_desc":"Штрихованные зоны направляют движение там, где полосы сливаются или расходятся. Не въезжайте в обозначенную зону, если граница сплошная. Если граница прерывистая, въезд возможен только когда это допускает дорожная ситуация и это безопасно."},{"id":18,"category":"Hatched markings","title":"Hatched markings separating opposing traffic","image":"data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20800%20500%22%3E%3Crect%20width%3D%22800%22%20height%3D%22500%22%20fill%3D%22%23b8c6ce%22%2F%3E%3Cpath%20d%3D%22M0%200H800V70L0%20170Z%22%20fill%3D%22%234ea06f%22%2F%3E%3Cpath%20d%3D%22M0%20430L800%20330V500H0Z%22%20fill%3D%22%234ea06f%22%2F%3E%3Cpath%20d%3D%22M120%20150C280%20210%20520%20210%20680%20150L680%20350C520%20290%20280%20290%20120%20350Z%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%2216%22%2F%3E%3Cg%20stroke%3D%22%23fff%22%20stroke-width%3D%2212%22%3E%3Cpath%20d%3D%22M145%20170l90%20160%22%2F%3E%3Cpath%20d%3D%22M215%20170l90%20160%22%2F%3E%3Cpath%20d%3D%22M285%20170l90%20160%22%2F%3E%3Cpath%20d%3D%22M355%20170l90%20160%22%2F%3E%3Cpath%20d%3D%22M425%20170l90%20160%22%2F%3E%3Cpath%20d%3D%22M495%20170l90%20160%22%2F%3E%3Cpath%20d%3D%22M565%20170l90%20160%22%2F%3E%3Cpath%20d%3D%22M635%20170l90%20160%22%2F%3E%3C%2Fg%3E%3Cpath%20d%3D%22M70%20250H250%22%20stroke%3D%22%23fff%22%20stroke-width%3D%2218%22%2F%3E%3Cpath%20d%3D%22M730%20250H550%22%20stroke%3D%22%23fff%22%20stroke-width%3D%2218%22%2F%3E%3C%2Fsvg%3E","uk":"Штрихована зона між зустрічними потоками","ru":"Штрихованная зона между встречными потоками","en_desc":"These markings form a central traffic island separating vehicles travelling in opposite directions. Keep out of the hatched area and follow the arrows and lane markings.","uk_desc":"Ця розмітка утворює центральний острівець, що розділяє транспортні потоки протилежних напрямків. Не в’їжджайте в штриховану зону та дотримуйтеся стрілок і смуг руху.","ru_desc":"Эта разметка образует центральный островок, разделяющий транспортные потоки встречных направлений. Не въезжайте в штрихованную зону и следуйте стрелкам и полосам движения."},{"id":19,"category":"2+1 roads","title":"2+1 road markings","image":"data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20800%20500%22%3E%3Crect%20width%3D%22800%22%20height%3D%22500%22%20fill%3D%22%23b8c6ce%22%2F%3E%3Cpath%20d%3D%22M0%20165H800M0%20335H800%22%20stroke%3D%22%23fff%22%20stroke-width%3D%2214%22%2F%3E%3Cpath%20d%3D%22M400%200V500%22%20stroke%3D%22%23fff%22%20stroke-width%3D%2216%22%2F%3E%3Cg%20stroke%3D%22%23fff%22%20stroke-width%3D%2212%22%3E%3Cpath%20d%3D%22M280%200V500%22%20stroke-dasharray%3D%2255%2035%22%2F%3E%3Cpath%20d%3D%22M520%200V500%22%20stroke-dasharray%3D%2255%2035%22%2F%3E%3C%2Fg%3E%3Cpath%20d%3D%22M330%20110v-70m0%200l-30%2035m30-35l30%2035M330%20390v70m0%200l-30-35m30%2035l30-35M610%20390v70m0%200l-30-35m30%2035l30-35%22%20stroke%3D%22%23fff%22%20stroke-width%3D%2212%22%20fill%3D%22none%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fsvg%3E","uk":"Розмітка дороги 2+1","ru":"Разметка дороги 2+1","en_desc":"A 2+1 road alternates between two lanes in one direction and one lane in the other. The two-lane section provides a controlled overtaking opportunity. Stay in your lane, obey the arrows and do not cross the central separation area or barrier.","uk_desc":"На дорозі 2+1 по черзі є дві смуги в одному напрямку та одна в іншому. Двосмугова ділянка дає контрольовану можливість для обгону. Тримайтеся своєї смуги, виконуйте вимоги стрілок і не перетинайте центральну розділювальну зону або бар’єр.","ru_desc":"На дороге 2+1 поочерёдно есть две полосы в одном направлении и одна в другом. Двухполосный участок даёт контролируемую возможность для обгона. Держитесь своей полосы, следуйте стрелкам и не пересекайте центральную разделительную зону или барьер."},{"id":20,"category":"Bus lanes","title":"With-flow bus lane","image":"data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20800%20500%22%3E%3Crect%20width%3D%22800%22%20height%3D%22500%22%20fill%3D%22%23b8c6ce%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2270%22%20width%3D%22260%22%20height%3D%22360%22%20fill%3D%22%23a94b59%22%20opacity%3D%22.75%22%2F%3E%3Cpath%20d%3D%22M300%2070V430%22%20stroke%3D%22%23fff%22%20stroke-width%3D%2216%22%2F%3E%3Ctext%20x%3D%22170%22%20y%3D%22275%22%20text-anchor%3D%22middle%22%20font-family%3D%22Arial%22%20font-size%3D%2265%22%20font-weight%3D%22700%22%20fill%3D%22%23fff%22%20transform%3D%22rotate(-90%20170%20275)%22%3EL%C3%81NA%20BUS%3C%2Ftext%3E%3Cpath%20d%3D%22M530%20360V140m0%200l-40%2050m40-50l40%2050%22%20stroke%3D%22%23fff%22%20stroke-width%3D%2218%22%20fill%3D%22none%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fsvg%3E","uk":"Автобусна смуга попутного напрямку","ru":"Автобусная полоса попутного направления","en_desc":"Runs in the same direction as the traffic beside it. It is reserved for the vehicles shown on the signs during the displayed operating times. Other traffic may use it only when the sign permits.","uk_desc":"Проходить у тому самому напрямку, що й сусідній транспортний потік. У зазначені на знаку години смуга зарезервована для транспортних засобів, указаних на знаках. Інший транспорт може користуватися нею лише тоді, коли це дозволено знаком.","ru_desc":"Проходит в том же направлении, что и соседний транспортный поток. В указанное на знаке время полоса зарезервирована для транспортных средств, указанных на знаках. Другой транспорт может пользоваться ею только когда это разрешено знаком."},{"id":21,"category":"Bus lanes","title":"Contra-flow bus lane","image":"data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20800%20500%22%3E%3Crect%20width%3D%22800%22%20height%3D%22500%22%20fill%3D%22%23b8c6ce%22%2F%3E%3Crect%20x%3D%22500%22%20y%3D%2270%22%20width%3D%22260%22%20height%3D%22360%22%20fill%3D%22%23a94b59%22%20opacity%3D%22.75%22%2F%3E%3Cpath%20d%3D%22M500%2070V430%22%20stroke%3D%22%23fff%22%20stroke-width%3D%2216%22%2F%3E%3Ctext%20x%3D%22630%22%20y%3D%22275%22%20text-anchor%3D%22middle%22%20font-family%3D%22Arial%22%20font-size%3D%2265%22%20font-weight%3D%22700%22%20fill%3D%22%23fff%22%20transform%3D%22rotate(90%20630%20275)%22%3EL%C3%81NA%20BUS%3C%2Ftext%3E%3Cpath%20d%3D%22M270%20140V360m0%200l-40-50m40%2050l40-50%22%20stroke%3D%22%23fff%22%20stroke-width%3D%2218%22%20fill%3D%22none%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fsvg%3E","uk":"Автобусна смуга зустрічного напрямку","ru":"Автобусная полоса встречного направления","en_desc":"Carries buses in the opposite direction to the traffic in the adjoining lane. Do not enter unless your vehicle is authorised. Take extra care because buses may approach from an unexpected direction.","uk_desc":"Проводить автобуси у напрямку, протилежному руху на сусідній смузі. Не в’їжджайте, якщо ваш транспортний засіб не має дозволу. Будьте особливо уважні, оскільки автобус може наближатися з неочікуваного напрямку.","ru_desc":"Проводит автобусы в направлении, противоположном движению на соседней полосе. Не въезжайте, если ваше транспортное средство не имеет разрешения. Будьте особенно внимательны, поскольку автобус может приближаться с неожиданного направления."},{"id":22,"category":"Cycle markings","title":"Cycle lane","image":"data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20800%20500%22%3E%3Crect%20width%3D%22800%22%20height%3D%22500%22%20fill%3D%22%23b8c6ce%22%2F%3E%3Crect%20x%3D%22500%22%20y%3D%2255%22%20width%3D%22240%22%20height%3D%22390%22%20fill%3D%22%23d8848e%22%20opacity%3D%22.75%22%2F%3E%3Cpath%20d%3D%22M500%2055V445%22%20stroke%3D%22%23fff%22%20stroke-width%3D%2214%22%2F%3E%3Ccircle%20cx%3D%22620%22%20cy%3D%22215%22%20r%3D%2245%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%2212%22%2F%3E%3Ccircle%20cx%3D%22690%22%20cy%3D%22215%22%20r%3D%2245%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%2212%22%2F%3E%3Cpath%20d%3D%22M620%20215l32-55%2038%2055m-38-55l-18-35m18%2035h38%22%20stroke%3D%22%23fff%22%20stroke-width%3D%2210%22%20fill%3D%22none%22%20stroke-linecap%3D%22round%22%2F%3E%3Cpath%20d%3D%22M260%20360V140m0%200l-40%2050m40-50l40%2050%22%20stroke%3D%22%23fff%22%20stroke-width%3D%2218%22%20fill%3D%22none%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fsvg%3E","uk":"Велосипедна смуга","ru":"Велосипедная полоса","en_desc":"A marked part of the road reserved for cyclists. Do not drive or park in a mandatory cycle lane during its operating times. Before crossing a cycle lane to turn, check carefully and give way to cyclists.","uk_desc":"Позначена частина дороги, призначена для велосипедистів. Не рухайтеся та не паркуйтеся на обов’язковій велосипедній смузі під час її дії. Перед перетинанням смуги для повороту уважно перевірте обстановку та пропустіть велосипедистів.","ru_desc":"Обозначенная часть дороги, предназначенная для велосипедистов. Не двигайтесь и не паркуйтесь на обязательной велосипедной полосе во время её действия. Перед пересечением полосы для поворота внимательно проверьте обстановку и уступите велосипедистам."}];
const T={uk:{title:'Дорожня розмітка Ірландії',search:'Пошук розмітки…',menu:'Меню',all:'Усі',count:'видів розмітки',meaning:'Що означає',prev:'← Попередня',next:'Наступна →'},en:{title:'Irish Road Markings',search:'Search road marking…',menu:'Menu',all:'All',count:'road markings',meaning:'What it means',prev:'← Previous',next:'Next →'},ru:{title:'Дорожная разметка Ирландии',search:'Поиск разметки…',menu:'Меню',all:'Все',count:'видов разметки',meaning:'Что означает',prev:'← Предыдущая',next:'Следующая →'}};
const CAT={"Parking restrictions":{"uk":"Обмеження паркування","en":"Parking restrictions","ru":"Ограничения парковки"},"Road edge markings":{"uk":"Край дороги та узбіччя","en":"Road edge markings","ru":"Край дороги и обочина"},"Junction markings":{"uk":"Розмітка перехресть","en":"Junction markings","ru":"Разметка перекрёстков"},"Centre lines":{"uk":"Центральні лінії","en":"Centre lines","ru":"Центральные линии"},"Crossing markings":{"uk":"Пішохідні переходи","en":"Crossing markings","ru":"Пешеходные переходы"},"Special road markings":{"uk":"Спеціальна розмітка","en":"Special road markings","ru":"Специальная разметка"},"Hatched markings":{"uk":"Штрихована розмітка","en":"Hatched markings","ru":"Штрихованная разметка"},"2+1 roads":{"uk":"Дороги 2+1","en":"2+1 roads","ru":"Дороги 2+1"},"Bus lanes":{"uk":"Автобусні смуги","en":"Bus lanes","ru":"Автобусные полосы"},"Cycle markings":{"uk":"Велосипедна розмітка","en":"Cycle markings","ru":"Велосипедная разметка"}};
let lang=localStorage.getItem('roadSignsLang')||'uk',cat='all',filtered=[],current=0;
const $=id=>document.getElementById(id);const cats=[...new Set(DATA.map(x=>x.category))];
function catName(c){return CAT[c]?.[lang]||c}function titleText(x){return lang==='uk'?x.uk:lang==='ru'?x.ru:x.title}function descText(x){return lang==='uk'?x.uk_desc:lang==='ru'?x.ru_desc:x.en_desc}
function proxyUrl(url){try{const u=new URL(url);return `https://images.weserv.nl/?url=${encodeURIComponent(u.host+u.pathname+u.search)}&w=900&output=webp`}catch(e){return url}}
function imageFail(img){if(!img.dataset.proxyTried){img.dataset.proxyTried='1';img.src=proxyUrl(img.dataset.original||img.src);return}img.parentElement.innerHTML='<div class="broken">Image temporarily unavailable</div>'}
function apply(){const t=T[lang];document.documentElement.lang=lang;$('pageTitle').textContent=t.title;$('q').placeholder=t.search;$('menuText').textContent=t.menu;document.querySelectorAll('.langbtn').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));renderChips();render()}
function renderChips(){$('chips').innerHTML=`<button class="chip ${cat==='all'?'active':''}" data-c="all">${T[lang].all}</button>`+cats.map(c=>`<button class="chip ${cat===c?'active':''}" data-c="${c}">${catName(c)}</button>`).join('');$('chips').querySelectorAll('button').forEach(b=>b.onclick=()=>{cat=b.dataset.c;renderChips();render()})}
function render(){const s=$('q').value.trim().toLowerCase();filtered=DATA.filter(x=>(cat==='all'||x.category===cat)&&(!s||x.title.toLowerCase().includes(s)||x.uk.toLowerCase().includes(s)||x.ru.toLowerCase().includes(s)||catName(x.category).toLowerCase().includes(s)));$('count').textContent=`${filtered.length} ${T[lang].count}`;$('grid').innerHTML=filtered.map((x,i)=>`<button class="card" data-i="${i}"><span class="card-info" aria-hidden="true">ⓘ</span><div class="pic"><img loading="lazy" data-original="${x.image}" src="${x.image}" alt="${x.title}" onerror="imageFail(this)"></div><div class="title">${x.title}</div><div class="translation">${lang==='en'?catName(x.category):titleText(x)}</div></button>`).join('');$('grid').querySelectorAll('.card').forEach(b=>b.onclick=()=>openCard(+b.dataset.i))}
function openCard(i){current=i;const x=filtered[i];$('detail').innerHTML=`<span class="badge">${catName(x.category)}</span><div class="heroimg"><img data-original="${x.image}" src="${x.image}" alt="${x.title}" onerror="imageFail(this)"></div><h2 class="detail-title">${x.title}</h2>${lang==='en'?'':`<div class="detail-translation">${titleText(x)}</div>`}<div class="info"><b>${T[lang].meaning}</b><br>${descText(x)}</div><div class="source-note">RSA Rules of the Road</div><div class="nav"><button id="prevBtn">${T[lang].prev}</button><button id="nextBtn">${T[lang].next}</button></div>`;$('prevBtn').onclick=()=>move(-1);$('nextBtn').onclick=()=>move(1);$('overlay').classList.add('open');document.body.classList.add('no-scroll')}
function move(d){if(filtered.length)openCard((current+d+filtered.length)%filtered.length)}function closeModal(){$('overlay').classList.remove('open');document.body.classList.remove('no-scroll')}

const INTRO_COPY={"uk":["Як користуватися","Натисніть на будь-яку дорожню розмітку, щоб відкрити її та переглянути пояснення.","Зрозуміло"],"en":["How to use","Tap any road marking to open it and view the explanation.","OK"],"ru":["Как пользоваться","Нажмите на любую дорожную разметку, чтобы открыть её и посмотреть объяснение.","Понятно"]};

function updateIntroLanguage(){if(!$('introOverlay').classList.contains('open'))return;const c=INTRO_COPY[lang]||INTRO_COPY.en;$('introTitle').textContent=c[0];$('introText').textContent=c[1];$('introOk').textContent=c[2]}
function showIntroIfNeeded(){if(localStorage.getItem('roadMarkingsIntroSeen')==='1')return;const c=INTRO_COPY[lang]||INTRO_COPY.en;$('introTitle').textContent=c[0];$('introText').textContent=c[1];$('introOk').textContent=c[2];$('introOverlay').classList.add('open');document.body.classList.add('no-scroll')}
function closeIntro(){localStorage.setItem('roadMarkingsIntroSeen','1');$('introOverlay').classList.remove('open');document.body.classList.remove('no-scroll')}
$('introOk').onclick=closeIntro;$('introOverlay').onclick=e=>{if(e.target===$('introOverlay'))closeIntro()};
$('q').oninput=render;$('close').onclick=closeModal;$('overlay').onclick=e=>{if(e.target===$('overlay'))closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});document.querySelectorAll('.langbtn').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;localStorage.setItem('roadSignsLang',lang);apply();updateIntroLanguage()});apply();setTimeout(showIntroIfNeeded,180);
</script></body></html>
