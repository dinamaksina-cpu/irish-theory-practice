<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Irish Road Markings</title><style>
:root{--bg:#f5f7fb;--card:#fff;--text:#152033;--muted:#687386;--accent:#153b34;--blue:#0788f5;--line:#e5e9f0}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}body.no-scroll{overflow:hidden}header{position:sticky;top:0;z-index:5;background:rgba(245,247,251,.97);backdrop-filter:blur(12px);padding:14px;border-bottom:1px solid var(--line)}.toprow{display:flex;align-items:center;justify-content:space-between;gap:10px}.backmenu{display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:var(--accent);background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 14px;font-weight:800}.langbar{display:flex;gap:7px}.langbtn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 13px;font-weight:800;color:var(--blue)}.langbtn.active{background:var(--accent);color:#fff;border-color:var(--accent)}h1{font-size:27px;margin:12px 0}.search{width:100%;padding:15px;border:1px solid var(--line);border-radius:16px;font-size:16px;background:#fff}.chips{display:flex;gap:8px;overflow:auto;padding:12px 0 2px;scrollbar-width:none}.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;color:var(--blue);border-radius:999px;padding:10px 14px;font-weight:800}.chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}main{padding:14px;max-width:1050px;margin:auto}.count{font-size:14px;color:var(--muted);margin:8px 0 14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{border:0;background:var(--card);border-radius:20px;padding:11px;box-shadow:0 5px 18px rgba(24,39,75,.07);min-height:210px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}.pic{height:125px;width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:14px}.pic img{width:100%;height:100%;object-fit:cover}.title{font-size:14px;font-weight:900;text-align:center;line-height:1.25;margin-top:10px;color:var(--blue)}.translation{font-size:12px;color:var(--muted);text-align:center;line-height:1.25;margin-top:5px}.overlay{position:fixed;inset:0;background:rgba(9,18,30,.48);z-index:20;display:none;align-items:flex-end}.overlay.open{display:flex}.sheet{position:relative;background:#fff;width:100%;max-height:92vh;border-radius:24px 24px 0 0;padding:18px;overflow:auto}.handle{width:44px;height:5px;background:#d7dce5;border-radius:4px;margin:0 auto 16px}.close{position:absolute;right:16px;top:14px;border:0;background:#eef1f5;width:40px;height:40px;border-radius:50%;font-size:24px;cursor:pointer}.heroimg{height:230px;display:flex;align-items:center;justify-content:center;margin-top:20px}.heroimg img{max-width:100%;max-height:220px;border-radius:16px;object-fit:contain}.badge{display:inline-block;background:#e8f7f1;color:#08734d;padding:7px 10px;border-radius:999px;font-size:12px;font-weight:800}.detail-title{font-size:23px;margin:14px 0 5px}.detail-translation{font-size:17px;color:var(--muted);font-weight:700}.info{background:#f7f9fc;padding:14px;border-radius:16px;margin:12px 0;line-height:1.5}.source-note{font-size:11px;color:var(--muted);text-align:right;margin:-4px 4px 12px}.nav{display:flex;gap:10px}.nav button{flex:1;padding:13px;border:0;border-radius:14px;font-weight:800}.broken{font-size:12px;color:#a33;text-align:center}@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}.overlay{align-items:center;justify-content:center}.sheet{max-width:580px;border-radius:24px}}

.card{position:relative;transition:transform .15s ease,box-shadow .15s ease}.card:active{transform:scale(.98)}.card-info{position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.96);border:1px solid var(--line);box-shadow:0 3px 10px rgba(24,39,75,.10);font-size:18px;font-weight:800;color:#0b84ff;line-height:1;pointer-events:none}.intro-overlay{position:fixed;inset:0;background:rgba(9,18,30,.48);z-index:50;display:none;align-items:center;justify-content:center;padding:22px}.intro-overlay.open{display:flex}.intro-box{width:min(100%,420px);background:#fff;border-radius:24px;padding:24px;box-shadow:0 20px 60px rgba(9,18,30,.22);text-align:center}.intro-icon{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;background:#e8f7f1;color:#153b34;font-size:30px;font-weight:800}.intro-box h3{margin:0 0 10px;font-size:22px}.intro-box p{margin:0 0 20px;color:var(--muted);line-height:1.5;font-size:16px}.intro-ok{width:100%;border:0;border-radius:14px;padding:14px;background:#153b34;color:#fff;font-size:16px;font-weight:800;cursor:pointer}
</style></head><body><header><div class="toprow"><a class="backmenu" href="learning.html">← <span id="menuText">Меню</span></a><div class="langbar"><button class="langbtn" data-lang="uk">UA</button><button class="langbtn" data-lang="en">EN</button><button class="langbtn" data-lang="ru">RU</button></div></div><h1 id="pageTitle"></h1><input id="q" class="search"><div id="chips" class="chips"></div></header><main><div id="count" class="count"></div><div id="grid" class="grid"></div></main><div id="introOverlay" class="intro-overlay" role="dialog" aria-modal="true" aria-labelledby="introTitle"><div class="intro-box"><div class="intro-icon">ⓘ</div><h3 id="introTitle"></h3><p id="introText"></p><button id="introOk" class="intro-ok" type="button"></button></div></div><div id="overlay" class="overlay"><div class="sheet"><div class="handle"></div><button id="close" class="close" aria-label="Close">×</button><div id="detail"></div></div></div><script>
const DATA=[{"id":1,"category":"Parking restrictions","title":"Single yellow line","image":"https://static.aviva.io/content/dam/aviva-public/ie/articles/car/1%20-%20irish-road-markings-single-yellow-lines.jpg","uk":"Одна жовта лінія","ru":"Одна жёлтая линия","en_desc":"Parking is prohibited during the times shown on a nearby information sign. Check the sign because the restriction times can vary.","uk_desc":"Паркування заборонене у години, зазначені на найближчому інформаційному знаку. Перевіряйте знак, оскільки години дії обмеження можуть відрізнятися.","ru_desc":"Парковка запрещена в часы, указанные на ближайшем информационном знаке. Проверяйте знак, поскольку время действия ограничения может отличаться."},{"id":2,"category":"Parking restrictions","title":"Double yellow lines","image":"https://static.aviva.io/content/dam/aviva-public/ie/articles/car/2%20-%20irish-road-markings-double-yellow-lines.jpg","uk":"Подвійні жовті лінії","ru":"Двойные жёлтые линии","en_desc":"Parking is prohibited at all times. The restriction normally applies every day, including Sundays and public holidays.","uk_desc":"Паркування заборонене в будь-який час. Обмеження зазвичай діє щодня, включно з неділями та державними святами.","ru_desc":"Парковка запрещена в любое время. Ограничение обычно действует ежедневно, включая воскресенья и государственные праздники."},{"id":3,"category":"Road edge markings","title":"Broken yellow hard-shoulder line","image":"https://static.aviva.io/content/dam/aviva-public/ie/articles/car/3%20-%20irish-road-markings-single-broken-yellow-line-along-the-left-hand-side-of-the-road.jpg","uk":"Переривчаста жовта лінія узбіччя","ru":"Прерывистая жёлтая линия обочины","en_desc":"Marks the edge of the carriageway and the hard shoulder. On ordinary roads, a driver may use the hard shoulder briefly only when it is safe, for example to allow faster traffic to pass, while giving priority to pedestrians and cyclists. On a motorway, use the hard shoulder only in an emergency.","uk_desc":"Позначає край проїзної частини та узбіччя. На звичайній дорозі водій може короткочасно використати узбіччя лише тоді, коли це безпечно, наприклад щоб пропустити швидший транспорт, надаючи перевагу пішоходам і велосипедистам. На автомагістралі узбіччя використовують лише в аварійній ситуації.","ru_desc":"Обозначает край проезжей части и обочину. На обычной дороге водитель может кратковременно использовать обочину только когда это безопасно, например чтобы пропустить более быстрый транспорт, уступая пешеходам и велосипедистам. На автомагистрали обочину используют только в аварийной ситуации."},{"id":8,"category":"Centre lines","title":"Single broken white centre line","image":"https://static.aviva.io/content/dam/aviva-public/ie/articles/car/5%20-%20irish-road-markeings-single-broken-white-lines-along-the-centre-of-the-road.jpg","uk":"Одна переривчаста біла центральна лінія","ru":"Одна прерывистая белая центральная линия","en_desc":"Separates traffic travelling in opposite directions. You may cross it to overtake or turn only when the road ahead is clear and it is safe and legal to do so.","uk_desc":"Розділяє транспортні потоки протилежних напрямків. Перетинати її для обгону або повороту можна лише тоді, коли дорога попереду вільна і маневр є безпечним та дозволеним.","ru_desc":"Разделяет транспортные потоки встречных направлений. Пересекать её для обгона или поворота можно только когда дорога впереди свободна и манёвр безопасен и разрешён."},{"id":9,"category":"Centre lines","title":"Longer broken white warning line","image":"https://static.aviva.io/content/dam/aviva-public/ie/articles/car/6%20-%20irish-road-markings-single-longer-broken-white-lines-with-shorter-gaps-between-the-lines.jpg","uk":"Довга переривчаста біла попереджувальна лінія","ru":"Длинная прерывистая белая предупреждающая линия","en_desc":"Longer white marks with shorter gaps warn of a hazard or a continuous white line ahead. Take extra care and complete any overtaking manoeuvre in good time.","uk_desc":"Довші білі штрихи з коротшими проміжками попереджають про небезпеку або суцільну білу лінію попереду. Будьте особливо уважні та завчасно завершіть обгін.","ru_desc":"Более длинные белые штрихи с короткими промежутками предупреждают об опасности или сплошной белой линии впереди. Будьте особенно внимательны и заранее завершите обгон."},{"id":10,"category":"Centre lines","title":"Single solid white centre line","image":"https://static.aviva.io/content/dam/aviva-public/ie/articles/car/7%20-%20irish-road-markings-single-solid-white-line.jpg","uk":"Одна суцільна біла центральна лінія","ru":"Одна сплошная белая центральная линия","en_desc":"Keep to the left of the line. Do not cross it to overtake or make a U-turn, except where the rules specifically allow crossing, such as access to premises or an emergency.","uk_desc":"Тримайтеся ліворуч від лінії. Не перетинайте її для обгону чи розвороту, крім випадків, прямо дозволених правилами, наприклад для заїзду на прилеглу територію або в надзвичайній ситуації.","ru_desc":"Держитесь слева от линии. Не пересекайте её для обгона или разворота, кроме случаев, прямо разрешённых правилами, например для въезда на прилегающую территорию или в экстренной ситуации."},{"id":12,"category":"Centre lines","title":"Double broken white lines","image":"https://static.aviva.io/content/dam/aviva-public/ie/articles/car/8%20-%20irish-road-markings-double-broken-white-lines.jpg","uk":"Подвійні переривчасті білі лінії","ru":"Двойные прерывистые белые линии","en_desc":"Warn that a continuous white line is ahead. Do not begin an overtaking manoeuvre unless you can complete it safely before the solid line starts.","uk_desc":"Попереджають, що попереду починається суцільна біла лінія. Не починайте обгін, якщо не зможете безпечно завершити його до початку суцільної лінії.","ru_desc":"Предупреждают, что впереди начинается сплошная белая линия. Не начинайте обгон, если не сможете безопасно завершить его до начала сплошной линии."},{"id":14,"category":"Crossing markings","title":"Zig-zag lines at a pedestrian crossing","image":"https://static.aviva.io/content/dam/aviva-public/ie/articles/car/9%20-%20irish-road-markings-white-lines-that-run-in-zig-zags.jpg","uk":"Зигзагоподібні лінії біля пішохідного переходу","ru":"Зигзагообразные линии у пешеходного перехода","en_desc":"These lines mark the controlled area of a pedestrian crossing. Do not park in this area and do not overtake the vehicle nearest the crossing if it has stopped or is slowing for pedestrians.","uk_desc":"Ці лінії позначають контрольовану зону пішохідного переходу. Не паркуйтеся в цій зоні та не обганяйте транспортний засіб біля переходу, якщо він зупинився або сповільнюється для пішоходів.","ru_desc":"Эти линии обозначают контролируемую зону пешеходного перехода. Не паркуйтесь в этой зоне и не обгоняйте транспортное средство у перехода, если оно остановилось или замедляется для пешеходов."},{"id":15,"category":"Junction markings","title":"Yellow box junction","image":"https://static.aviva.io/content/dam/aviva-public/ie/articles/car/10%20-%20irish-road-markings-yellow-diagonal-box-in-the-centre-of-the-road.jpg","uk":"Жовта коробчаста розмітка перехрестя","ru":"Жёлтая коробчатая разметка перекрёстка","en_desc":"Do not enter the yellow box unless your exit is clear. When turning right, you may wait in the box if you are prevented from completing the turn only by oncoming traffic or other right-turning vehicles.","uk_desc":"Не в’їжджайте в жовту розмітку, якщо виїзд із неї не вільний. Повертаючи праворуч, можна чекати в зоні, якщо завершити поворот заважає лише зустрічний транспорт або інші автомобілі, що повертають праворуч.","ru_desc":"Не въезжайте в жёлтую разметку, если выезд из неё не свободен. Поворачивая направо, можно ждать в зоне, если завершить поворот мешает только встречный транспорт или другие автомобили, поворачивающие направо."}];
const T={uk:{title:'Дорожня розмітка Ірландії',search:'Пошук розмітки…',menu:'Меню',all:'Усі',count:'видів розмітки',meaning:'Що означає',prev:'← Попередня',next:'Наступна →'},en:{title:'Irish Road Markings',search:'Search road marking…',menu:'Menu',all:'All',count:'road markings',meaning:'What it means',prev:'← Previous',next:'Next →'},ru:{title:'Дорожная разметка Ирландии',search:'Поиск разметки…',menu:'Меню',all:'Все',count:'видов разметки',meaning:'Что означает',prev:'← Предыдущая',next:'Следующая →'}};
const CAT={"Parking restrictions":{"uk":"Обмеження паркування","en":"Parking restrictions","ru":"Ограничения парковки"},"Road edge markings":{"uk":"Край дороги та узбіччя","en":"Road edge markings","ru":"Край дороги и обочина"},"Junction markings":{"uk":"Розмітка перехресть","en":"Junction markings","ru":"Разметка перекрёстков"},"Centre lines":{"uk":"Центральні лінії","en":"Centre lines","ru":"Центральные линии"},"Crossing markings":{"uk":"Пішохідні переходи","en":"Crossing markings","ru":"Пешеходные переходы"},"Special road markings":{"uk":"Спеціальна розмітка","en":"Special road markings","ru":"Специальная разметка"},"Hatched markings":{"uk":"Штрихована розмітка","en":"Hatched markings","ru":"Штрихованная разметка"},"2+1 roads":{"uk":"Дороги 2+1","en":"2+1 roads","ru":"Дороги 2+1"},"Bus lanes":{"uk":"Автобусні смуги","en":"Bus lanes","ru":"Автобусные полосы"},"Cycle markings":{"uk":"Велосипедна розмітка","en":"Cycle markings","ru":"Велосипедная разметка"}};
let lang=localStorage.getItem('roadSignsLang')||'uk',cat='all',filtered=[],current=0;
const $=id=>document.getElementById(id);const cats=[...new Set(DATA.map(x=>x.category))];
function catName(c){return CAT[c]?.[lang]||c}function titleText(x){return lang==='uk'?x.uk:lang==='ru'?x.ru:x.title}function descText(x){return lang==='uk'?x.uk_desc:lang==='ru'?x.ru_desc:x.en_desc}
function proxyUrl(url){try{const u=new URL(url);return `https://images.weserv.nl/?url=${encodeURIComponent(u.host+u.pathname+u.search)}&w=900&output=webp`}catch(e){return url}}
function imageFail(img){if(!img.dataset.proxyTried){img.dataset.proxyTried='1';img.src=proxyUrl(img.dataset.original||img.src);return}img.parentElement.innerHTML='<div class="broken">Image temporarily unavailable</div>'}
function apply(){const t=T[lang];document.documentElement.lang=lang;$('pageTitle').textContent=t.title;$('q').placeholder=t.search;$('menuText').textContent=t.menu;document.querySelectorAll('.langbtn').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));renderChips();render()}
function renderChips(){$('chips').innerHTML=`<button class="chip ${cat==='all'?'active':''}" data-c="all">${T[lang].all}</button>`+cats.map(c=>`<button class="chip ${cat===c?'active':''}" data-c="${c}">${catName(c)}</button>`).join('');$('chips').querySelectorAll('button').forEach(b=>b.onclick=()=>{cat=b.dataset.c;renderChips();render()})}
function render(){const s=$('q').value.trim().toLowerCase();filtered=DATA.filter(x=>(cat==='all'||x.category===cat)&&(!s||x.title.toLowerCase().includes(s)||x.uk.toLowerCase().includes(s)||x.ru.toLowerCase().includes(s)||catName(x.category).toLowerCase().includes(s)));$('count').textContent=`${filtered.length} ${T[lang].count}`;$('grid').innerHTML=filtered.map((x,i)=>`<button class="card" data-i="${i}"><span class="card-info" aria-hidden="true">ⓘ</span><div class="pic"><img loading="lazy" data-original="${x.image}" src="${x.image}" alt="${x.title}" onerror="imageFail(this)"></div><div class="title">${x.title}</div><div class="translation">${lang==='en'?catName(x.category):titleText(x)}</div></button>`).join('');$('grid').querySelectorAll('.card').forEach(b=>b.onclick=()=>openCard(+b.dataset.i))}
function openCard(i){current=i;const x=filtered[i];$('detail').innerHTML=`<span class="badge">${catName(x.category)}</span><div class="heroimg"><img data-original="${x.image}" src="${x.image}" alt="${x.title}" onerror="imageFail(this)"></div><h2 class="detail-title">${x.title}</h2>${lang==='en'?'':`<div class="detail-translation">${titleText(x)}</div>`}<div class="info"><b>${T[lang].meaning}</b><br>${descText(x)}</div><div class="source-note">RSA Rules of the Road</div><div class="nav"><button id="prevBtn">${T[lang].prev}</button><button id="nextBtn">${T[lang].next}</button></div>`;$('prevBtn').onclick=()=>move(-1);$('nextBtn').onclick=()=>move(1);$('overlay').classList.add('open');document.body.classList.add('no-scroll')}
function move(d){if(filtered.length)openCard((current+d+filtered.length)%filtered.length)}function closeModal(){$('overlay').classList.remove('open');document.body.classList.remove('no-scroll')}

const INTRO_COPY={"uk":["Як користуватися","Натисніть на будь-яку дорожню розмітку, щоб відкрити її та переглянути пояснення.","Зрозуміло"],"en":["How to use","Tap any road marking to open it and view the explanation.","OK"],"ru":["Как пользоваться","Нажмите на любую дорожную разметку, чтобы открыть её и посмотреть объяснение.","Понятно"]};

function updateIntroLanguage(){if(!$('introOverlay').classList.contains('open'))return;const c=INTRO_COPY[lang]||INTRO_COPY.en;$('introTitle').textContent=c[0];$('introText').textContent=c[1];$('introOk').textContent=c[2]}
function showIntroIfNeeded(){if(localStorage.getItem('roadMarkingsIntroSeenV2')==='1')return;const c=INTRO_COPY[lang]||INTRO_COPY.en;$('introTitle').textContent=c[0];$('introText').textContent=c[1];$('introOk').textContent=c[2];$('introOverlay').classList.add('open');document.body.classList.add('no-scroll')}
function closeIntro(){localStorage.setItem('roadMarkingsIntroSeenV2','1');$('introOverlay').classList.remove('open');document.body.classList.remove('no-scroll')}
$('introOk').onclick=closeIntro;$('introOverlay').onclick=e=>{if(e.target===$('introOverlay'))closeIntro()};
$('q').oninput=render;$('close').onclick=closeModal;$('overlay').onclick=e=>{if(e.target===$('overlay'))closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});document.querySelectorAll('.langbtn').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;localStorage.setItem('roadSignsLang',lang);apply();updateIntroLanguage()});apply();setTimeout(showIntroIfNeeded,180);
</script></body></html>
