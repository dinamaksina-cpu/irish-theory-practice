<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Автомагістралі</title>
<style>
:root{--green:#07392b;--mint:#edf7f3;--muted:#7d8c86;--white:#fff;--line:#dfeae5}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:linear-gradient(180deg,#f5fcf9,#eaf5f0);color:var(--green)}
.wrap{max-width:900px;margin:auto;padding:16px 18px 42px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:20;padding:10px 0 14px;background:rgba(245,252,249,.94);backdrop-filter:blur(12px)}
.back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;border:1px solid #edf2ef;background:#fff;border-radius:23px;padding:13px 18px;font-size:18px;font-weight:800;color:#83a399;box-shadow:0 2px 8px rgba(0,0,0,.03)}
.langs{display:flex;gap:8px}.langs button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:11px 15px;font-size:16px;font-weight:800;color:#94afa5}.langs button.active{background:linear-gradient(#a9cabe,#78a396);color:#fff;border-color:transparent}
h1{font-size:42px;line-height:1.08;margin:22px 0 10px}.lead{font-size:20px;line-height:1.45;color:var(--muted);margin:0 0 22px}
.guide{background:#fff;border-radius:26px;padding:22px 24px;margin-bottom:22px;box-shadow:0 8px 26px rgba(20,67,51,.06)}.guide h2{font-size:27px;margin:0 0 12px}.guide ul{margin:0;padding-left:24px;color:var(--muted);font-size:18px;line-height:1.55}.guide li+li{margin-top:8px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{background:#fff;border-radius:28px;padding:14px 14px 19px;box-shadow:0 8px 26px rgba(20,67,51,.06);position:relative;overflow:hidden}.num{position:absolute;top:26px;left:26px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--green);color:#fff;font-size:19px;font-weight:900;z-index:2;box-shadow:0 5px 14px rgba(0,0,0,.18)}
.imgbox{height:240px;border-radius:22px;background:linear-gradient(145deg,#eff9f5,#e3f1eb);display:flex;align-items:center;justify-content:center;padding:20px;overflow:hidden}.imgbox img{max-width:100%;max-height:100%;object-fit:contain;display:block}.card h2{font-size:24px;line-height:1.18;margin:18px 7px 9px}.card p{font-size:17px;line-height:1.5;color:var(--muted);margin:0 7px}.note{margin-top:22px;background:#dcf1e8;border-radius:20px;padding:17px 20px;color:#315e4e;font-size:17px;line-height:1.45;font-weight:650}
@media(max-width:620px){.wrap{padding:10px 14px 30px}.top{padding-top:8px}.back{padding:12px 16px}.langs button{padding:10px 14px}h1{font-size:36px;margin-top:18px}.lead{font-size:18px}.guide{padding:20px}.guide h2{font-size:25px}.guide ul{font-size:17px}.grid{grid-template-columns:1fr}.imgbox{height:250px}.card h2{font-size:25px}.card p{font-size:18px}}
</style>
</head>
<body><main class="wrap">
<div class="top"><a class="back" href="learning.html">← <span id="menu"></span></a><div class="langs"><button data-lang="ua" class="active">UA</button><button data-lang="en">EN</button><button data-lang="ru">RU</button></div></div>
<h1 id="title"></h1><p class="lead" id="lead"></p>
<section class="guide"><h2 id="guideTitle"></h2><ul id="guideList"></ul></section>
<section class="grid" id="grid"></section><div class="note" id="note"></div>
</main>
<script>
const DATA=[
{img:'https://nationaldrivingschool.ie/wp-content/uploads/2021/06/Motorway-ahead-1.png',title:{ua:'Автомагістраль попереду',en:'Motorway ahead',ru:'Автомагистраль впереди'},desc:{ua:'Знак попереджає, що попереду починається автомагістраль. Водіям з учнівським дозволом виїжджати на неї заборонено.',en:'This sign warns that a motorway begins ahead. Learner permit holders are not allowed to drive on it.',ru:'Знак предупреждает, что впереди начинается автомагистраль. Водителям с ученическим разрешением выезжать на неё запрещено.'}},
{img:'https://nationaldrivingschool.ie/wp-content/uploads/2021/06/Entry-to-motorway.png',title:{ua:'В’їзд на автомагістраль',en:'Entry to motorway',ru:'Въезд на автомагистраль'},desc:{ua:'Під час в’їзду зі смуги розгону підлаштуйте швидкість під потік і вливайтеся лише у безпечний проміжок.',en:'When joining from a slip road, match the speed of traffic and merge only into a safe gap.',ru:'При въезде с полосы разгона подстройте скорость под поток и вливайтесь только в безопасный промежуток.'}},
{img:'https://nationaldrivingschool.ie/wp-content/uploads/2021/06/300m-to-next-exit-1.png',title:{ua:'До з’їзду 300 метрів',en:'300 m to the next exit',ru:'До съезда 300 метров'},desc:{ua:'Три похилі смуги означають приблизно 300 метрів до з’їзду. Завчасно перевірте дзеркала та підготуйтеся до перестроювання.',en:'Three diagonal bars indicate about 300 metres to the exit. Check mirrors and prepare early.',ru:'Три наклонные полосы означают около 300 метров до съезда. Заранее проверьте зеркала и подготовьтесь.'}},
{img:'https://nationaldrivingschool.ie/wp-content/uploads/2021/06/200m-to-next-exit-1.png',title:{ua:'До з’їзду 200 метрів',en:'200 m to the next exit',ru:'До съезда 200 метров'},desc:{ua:'Дві похилі смуги означають приблизно 200 метрів до з’їзду. Увімкніть покажчик повороту завчасно.',en:'Two diagonal bars indicate about 200 metres to the exit. Signal in good time.',ru:'Две наклонные полосы означают около 200 метров до съезда. Включите указатель поворота заранее.'}},
{img:'https://nationaldrivingschool.ie/wp-content/uploads/2021/06/100m-to-next-exit-1.png',title:{ua:'До з’їзду 100 метрів',en:'100 m to the next exit',ru:'До съезда 100 метров'},desc:{ua:'Одна похила смуга означає приблизно 100 метрів до з’їзду. Не гальмуйте різко на основній смузі.',en:'One diagonal bar indicates about 100 metres to the exit. Do not brake sharply in the main lane.',ru:'Одна наклонная полоса означает около 100 метров до съезда. Не тормозите резко на основной полосе.'}},
{img:'https://nationaldrivingschool.ie/wp-content/uploads/2021/06/The-motorway-ends-1km-ahead-1.png',title:{ua:'Кінець автомагістралі через 1 км',en:'Motorway ends in 1 km',ru:'Конец автомагистрали через 1 км'},desc:{ua:'Починайте знижувати швидкість поступово та стежте за новими обмеженнями швидкості.',en:'Reduce speed gradually and watch for the new speed limit.',ru:'Начинайте снижать скорость постепенно и следите за новым ограничением скорости.'}},
{img:'https://nationaldrivingschool.ie/wp-content/uploads/2021/06/End-of-motorway-1.png',title:{ua:'Кінець автомагістралі',en:'End of motorway',ru:'Конец автомагистрали'},desc:{ua:'Після цього знака правила автомагістралі закінчуються. Далі діють правила та обмеження наступної дороги.',en:'Motorway rules end at this sign. The rules and limits of the next road then apply.',ru:'После этого знака правила автомагистрали заканчиваются. Далее действуют правила и ограничения следующей дороги.'}},
{img:'https://nationaldrivingschool.ie/wp-content/uploads/2021/07/Route-confirmatory-sign-for-M7.png',title:{ua:'Підтвердження маршруту',en:'Route confirmation sign',ru:'Подтверждение маршрута'},desc:{ua:'Синій знак показує номер автомагістралі, основні напрямки та відстані до них.',en:'A blue sign shows the motorway number, main destinations and distances.',ru:'Синий знак показывает номер автомагистрали, основные направления и расстояния до них.'}},
{img:'https://nationaldrivingschool.ie/wp-content/uploads/2021/06/Motorway-service-plaza.png',title:{ua:'Сервісна зона',en:'Motorway service area',ru:'Сервисная зона'},desc:{ua:'Знак указує на місце для пального, відпочинку, їжі та інших послуг. Плануйте зупинки заздалегідь.',en:'This sign indicates fuel, rest, food and other services. Plan your stops in advance.',ru:'Знак указывает на место для топлива, отдыха, еды и других услуг. Планируйте остановки заранее.'}}
];
const UI={ua:{title:'Автомагістралі',lead:'9 важливих знаків і правил для руху автомагістралями Ірландії.',menu:'Меню',guideTitle:'Що потрібно запам’ятати',guide:['Водіям з учнівським дозволом заборонено керувати автомобілем на автомагістралі.','За звичайних умов рухайтеся лівою смугою. Праву смугу використовуйте переважно для обгону.','Транспорт, який уже рухається автомагістраллю, має пріоритет над транспортом, що в’їжджає.','Смугу аварійної зупинки використовуйте лише у справжній надзвичайній ситуації.','Не зупиняйтеся, не здавайте назад і не розвертайтеся, навіть якщо пропустили потрібний з’їзд.','Дотримуйтеся безпечної дистанції та завчасно плануйте кожен маневр.'],note:'На автомагістралі швидкість значно вища, тому дивіться далеко вперед, регулярно перевіряйте дзеркала й уникайте різких маневрів.'},en:{title:'Motorways',lead:'9 important signs and rules for driving on Irish motorways.',menu:'Menu',guideTitle:'What to remember',guide:['Learner permit holders are not allowed to drive on a motorway.','In normal conditions, keep to the left lane. Use the right lane mainly for overtaking.','Traffic already on the motorway has priority over traffic joining it.','Use the hard shoulder only in a genuine emergency.','Never stop, reverse or turn around, even if you miss your exit.','Keep a safe distance and plan every manoeuvre early.'],note:'Motorway speeds are much higher, so look well ahead, check mirrors regularly and avoid sudden manoeuvres.'},ru:{title:'Автомагистрали',lead:'9 важных знаков и правил движения по автомагистралям Ирландии.',menu:'Меню',guideTitle:'Что нужно запомнить',guide:['Водителям с ученическим разрешением запрещено управлять автомобилем на автомагистрали.','В обычных условиях двигайтесь по левой полосе. Правую используйте преимущественно для обгона.','Транспорт, который уже движется по автомагистрали, имеет приоритет над въезжающим транспортом.','Полосу аварийной остановки используйте только в настоящей чрезвычайной ситуации.','Не останавливайтесь, не двигайтесь задним ходом и не разворачивайтесь, даже если пропустили съезд.','Соблюдайте безопасную дистанцию и заранее планируйте каждый манёвр.'],note:'На автомагистрали скорость значительно выше, поэтому смотрите далеко вперёд, регулярно проверяйте зеркала и избегайте резких манёвров.'}};
let lang='ua';function render(){const u=UI[lang];document.documentElement.lang=lang==='ua'?'uk':lang;title.textContent=u.title;lead.textContent=u.lead;menu.textContent=u.menu;guideTitle.textContent=u.guideTitle;guideList.innerHTML=u.guide.map(x=>`<li>${x}</li>`).join('');note.textContent=u.note;grid.innerHTML=DATA.map((x,i)=>`<article class="card"><span class="num">${i+1}</span><div class="imgbox"><img src="${x.img}" alt="${x.title[lang]}" loading="lazy"></div><h2>${x.title[lang]}</h2><p>${x.desc[lang]}</p></article>`).join('');document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang))}
document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.lang;render()}));render();
</script></body></html>
