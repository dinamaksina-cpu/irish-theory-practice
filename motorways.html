n\">↗</span>"},{"title":{"ua":"Безпечний обгін","en":"Safe overtaking","ru":"Безопасный обгон"},"desc":{"ua":"Перевірте дзеркала, подайте сигнал і обганяйте правою смугою лише коли це безпечно. Потім поверніться ліворуч.","en":"Check mirrors, signal and overtake in the right-hand lane only when safe. Then return to the left.","ru":"Проверьте зеркала, подайте сигнал и обгоняйте по правой полосе только когда безопасно. Затем вернитесь влево."},"visualHtml":"<span class=\"bigicon\">→</span>"},{"title":{"ua":"Пропустили з’їзд","en":"Missed your exit","ru":"Пропустили съезд"},"desc":{"ua":"Не зупиняйтеся і не рухайтеся назад. З’їдьте на наступному виїзді та скоригуйте маршрут.","en":"Do not stop or reverse. Leave at the next exit and correct your route.","ru":"Не останавливайтесь и не двигайтесь назад. Съезжайте на следующем выезде и скорректируйте маршрут."},"visualHtml":"<span class=\"bigicon\">⛔</span>"},{"title":{"ua":"Поломка або прокол","en":"Breakdown or puncture","ru":"Поломка или прокол"},"desc":{"ua":"Зупиніться на hard shoulder лише у надзвичайній ситуації, увімкніть аварійні вогні, вийдіть у безпечний бік і викличте допомогу.","en":"Use the hard shoulder only in an emergency, switch on hazard lights, leave the vehicle on the safe side and call for assistance.","ru":"Используйте hard shoulder только в экстренной ситуации, включите аварийные огни, выйдите с безопасной стороны и вызовите помощь."},"visualHtml":"<span class=\"bigicon\">⚠</span>"}];const UI={"ua":{"title":"Автомагістралі","lead":"10 основних правил для безпечного руху автомагістралями Ірландії.","menu":"Меню","guideTitle":"Що потрібно запам’ятати","guide":["Власникам learner permit заборонено їздити автомагістралями.","За нормальних умов тримайтеся лівої смуги; праву використовуйте для обгону.","Під час в’їзду зі slip road підлаштуйте швидкість і поступіться потоку на автомагістралі.","Hard shoulder використовується лише для надзвичайної зупинки.","На автомагістралі не можна підбирати чи висаджувати пасажирів.","Якщо пропустили з’їзд, продовжуйте до наступного — не зупиняйтеся і не здавайте назад."],"note":"Швидкість на автомагістралі вища, тому дивіться далеко вперед, тримайте безпечну дистанцію та плануйте маневри завчасно."},"en":{"title":"Motorways","lead":"10 key rules for safe motorway driving in Ireland.","menu":"Menu","guideTitle":"What to remember","guide":["Learner permit holders may not drive on motorways.","In normal conditions keep to the left; use the right lane for overtaking.","When joining from a slip road, match speed and give way to motorway traffic.","The hard shoulder is for emergency stopping only.","Do not pick up or set down passengers on a motorway.","If you miss an exit, continue to the next one — never stop or reverse."],"note":"Motorway speeds are higher, so look well ahead, keep a safe distance and plan every manoeuvre early."},"ru":{"title":"Автомагистрали","lead":"10 основных правил безопасного движения по автомагистралям Ирландии.","menu":"Меню","guideTitle":"Что нужно запомнить","guide":["Владельцам learner permit запрещено ездить по автомагистралям.","В обычных условиях держитесь левой полосы; правую используйте для обгона.","При въезде со slip road подстройте скорость и уступите потоку на автомагистрали.","Hard shoulder используется только для экстренной остановки.","На автомагистрали нельзя подбирать или высаживать пассажиров.","Если пропустили съезд, продолжайте до следующего — не останавливайтесь и не двигайтесь назад."],"note":"Скорость на автомагистрали выше, поэтому смотрите далеко вперёд, держите безопасную дистанцию и планируйте манёвры заранее."}};let lang='ua';function render(){document.documentElement.lang=lang==='ua'?'uk':lang;document.getElementById('title').textContent=UI[lang].title;document.getElementById('lead').textContent=UI[lang].lead;document.getElementById('menu').textContent=UI[lang].menu;document.getElementById('guideTitle').textContent=UI[lang].guideTitle;document.getElementById('guideList').innerHT
